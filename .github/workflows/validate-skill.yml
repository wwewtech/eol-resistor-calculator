name: Validate Skill
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate SKILL.md
        run: |
          if [ ! -f SKILL.md ]; then
            echo "SKILL.md is missing!"
            exit 1
          fi
