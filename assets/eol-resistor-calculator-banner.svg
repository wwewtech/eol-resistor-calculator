<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      .title { font-weight: 700; font-size: 28px; letter-spacing: -0.03em; fill: #ededed; }
      .sub { font-size: 14px; fill: #888888; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .code { font-size: 13px; line-height: 1.6; }
      .red { fill: #f87171; }
      .green { fill: #34d399; }
      .blue { fill: #60a5fa; }
      .dim { fill: #52525b; }
      .text-light { fill: #e4e4e7; }
      .amber { fill: #fbbf24; }
    </style>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="480" fill="#000000"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="440" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>

  <!-- Header Bar -->
  <line x1="20" y1="76" x2="1180" y2="76" stroke="#27272a" stroke-width="1"/>

  <!-- Left Header: Project Identity -->
  <g transform="translate(44, 48)">
    <rect x="0" y="-14" width="22" height="22" rx="4" fill="#f59e0b"/>
    <path d="M 4 -3 L 8 -7 L 11 1 L 14 -7 L 18 -3" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <text x="32" y="3" class="mono text-light" font-size="14" font-weight="600">eol-resistor-calculator</text>
    <text x="235" y="3" class="mono dim" font-size="14">/ SEOL · DEOL · TEOL</text>
  </g>

  <!-- Right Header: Status Telemetry -->
  <g transform="translate(1156, 48)">
    <text x="0" y="2" text-anchor="end" class="mono label dim">LOOP SUPERVISION: <tspan fill="#34d399">ACTIVE (4-STATE DEOL DISCRIMINATION)</tspan></text>
  </g>

  <!-- Split View Dividers -->
  <line x1="600" y1="76" x2="600" y2="416" stroke="#27272a" stroke-width="1"/>
  <line x1="20" y1="416" x2="1180" y2="416" stroke="#27272a" stroke-width="1"/>

  <!-- LEFT PANE: Flawed Panel Stacking (Rejected) -->
  <g transform="translate(44, 108)">
    <text x="0" y="0" class="mono label red">UNSAFE PRACTICE: PANEL-TERMINAL STACKING (REJECTED)</text>
    
    <g transform="translate(0, 32)" class="mono code">
      <text y="0" class="dim">01 <tspan class="red"># Resistor stacked directly at panel terminals</tspan></text>
      <text y="24" class="dim">02 <tspan class="red">Panel_Z1 &lt;--[5.6k Resistor]--&gt; Panel_COM</tspan></text>
      <text y="48" class="dim">03 <tspan class="red"># 100 meters of cable run with zero supervision:</tspan></text>
      <text y="72" class="dim">04 <tspan class="red">Wire cut by burglar --&gt; Panel still reads 5.6k (SECURE!)</tspan></text>
      <text y="96" class="dim">05 <tspan class="dim"># Defeats all tamper protection and line security</tspan></text>
      <text y="120" class="dim">06 <tspan class="red">wire_drop = 0  # Ignoring 22 AWG copper resistance</tspan></text>
      <text y="144" class="dim">07 <tspan class="red">twist_and_tape_splices()  # Oxidation false alarms</tspan></text>
      <text y="168" class="dim">08 <tspan class="red">bypass_zone_supervision()  # Grade 3 violation</tspan></text>
    </g>

    <g transform="translate(0, 240)">
      <rect width="510" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="14" y="25" class="mono red" font-size="12">&#x2717; Panel stacking hazard | 0% wire protection | False security</text>
    </g>
  </g>

  <!-- RIGHT PANE: Production Far-End DEOL (Verified) -->
  <g transform="translate(640, 108)">
    <text x="0" y="0" class="mono label green">PRODUCTION: FAR-END DEOL WITH COPPER DROP COMPENSATION</text>
    
    <g transform="translate(0, 32)" class="mono code">
      <text y="0" class="dim">01 <tspan class="blue">R_loop</tspan> = 2 * distance_m * 0.053  <tspan class="green"># 22 AWG wire resistance</tspan></text>
      <text y="24" class="dim">02 <tspan class="green"># Both resistors installed inside remote sensor:</tspan></text>
      <text y="48" class="dim">03 state_secure = R_eol + R_loop                 <tspan class="green"># 5.61k Ω</tspan></text>
      <text y="72" class="dim">04 state_alarm  = R_eol + R_alarm + R_loop       <tspan class="blue"># 11.21k Ω</tspan></text>
      <text y="96" class="dim">05 state_short  = R_loop (0 Ω)                  <tspan class="amber"># TAMPER SHORT</tspan></text>
      <text y="120" class="dim">06 state_cut    = float('inf') (∞ Ω)             <tspan class="red"># TAMPER OPEN</tspan></text>
      <text y="144" class="dim">07 <tspan class="green">assert panel_min &lt;= state_secure &lt;= panel_max</tspan></text>
      <text y="168" class="dim">08 verify_adc_window(V_ref=5.0, R_pullup=2200)</text>
    </g>

    <g transform="translate(0, 240)">
      <rect width="510" height="42" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="14" y="25" class="mono green" font-size="12">&#x2713; Far-end supervision | 4-state discrimination | Wire drop accounted</text>
    </g>
  </g>

  <!-- Footer Telemetry -->
  <g transform="translate(44, 442)">
    <text class="mono dim" font-size="12">PANELS: <tspan class="text-light">DSC (5.6k) · Honeywell (2.0k) · Paradox (1.0k) · Texecom · Bosch</tspan></text>
    <text x="500" class="mono dim" font-size="12">STANDARDS: <tspan class="green">EN 50131 Grade 2 / Grade 3</tspan></text>
    <text x="820" class="mono dim" font-size="12">GAUGES: <tspan class="text-light">18, 20, 22, 24 AWG</tspan></text>
    <text x="1112" text-anchor="end" class="mono green" font-size="12">&#x25CF; SUPERVISED</text>
  </g>
</svg>
